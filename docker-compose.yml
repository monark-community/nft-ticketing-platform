version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ${POSTGRES_ENVIRONMENT:-dev}-nft-ticketing-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing_password}
      POSTGRES_DB: ${POSTGRES_DB:-nft_ticketing}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - nft-network

  # API Service
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: nft-ticketing-api
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ticketing_user:ticketing_password@db:5432/nft_ticketing?schema=public}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./services/api:/app
      - /app/node_modules
    networks:
      - nft-network

  # Web Frontend Service
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: nft-ticketing-web
    # Dev server runs with a bind mount (host-owned files), so run as root here.
    # The image default stays non-root.
    user: root
    environment:
      NODE_ENV: development
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./services/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - nft-network

volumes:
  postgres_data:

networks:
  nft-network:
    driver: bridge
