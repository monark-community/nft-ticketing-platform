# Throwaway Postgres for the API test suite. It runs on port 5433 and keeps its
# data in memory, so it never touches the dev database and starts clean each time.
#
#   npm run test:db:up     start it
#   npm test               run the tests
#   npm run test:db:down   stop it
services:
  test-db:
    image: postgres:15-alpine
    container_name: nft-ticketing-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: nft_ticketing_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d nft_ticketing_test"]
      interval: 2s
      timeout: 5s
      retries: 15
